name: CI & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^\.claude/' || true)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ldflags="-X main.version=${{ github.ref_name }}"
          GOOS=linux   GOARCH=amd64 go build -ldflags "$ldflags" -o dist/ttssh-linux-amd64       ./cmd/ttssh
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$ldflags" -o dist/ttssh-darwin-amd64      ./cmd/ttssh
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$ldflags" -o dist/ttssh-darwin-arm64      ./cmd/ttssh
          GOOS=windows GOARCH=amd64 go build -ldflags "$ldflags" -o dist/ttssh-windows-amd64.exe ./cmd/ttssh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ttssh-*
